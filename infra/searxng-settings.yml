# Minimal SearXNG settings for the symbient's web_search tool.
# REQUIRED before first start: replace secret_key with your own, e.g.
#   sed -i "s/CHANGE_ME_RUN_setup/$(openssl rand -hex 32)/" infra/searxng-settings.yml
use_default_settings: true
server:
  secret_key: "CHANGE_ME_RUN_setup"
  limiter: false
search:
  # web_search calls SearXNG with format=json — keep it enabled
  formats:
    - html
    - json
