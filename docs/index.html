<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feyblet — System Architecture</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #818cf8;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.8rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }
  header h1 b { font-weight: 700; color: var(--gold); }
  header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  nav {
    display: flex;
    gap: 4px;
    padding: 16px 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    background: var(--surface);
  }
  nav button {
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    white-space: nowrap;
    transition: all 0.15s;
  }
  nav button:hover { border-color: var(--accent); color: var(--text); }
  nav button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  main { padding: 24px 40px; }
  .diagram-container {
    display: none;
    flex-direction: column;
    gap: 20px;
  }
  .diagram-container.active { display: flex; }
  .diagram-meta {
    padding: 16px 20px;
    background: var(--surface);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }
  .diagram-meta h2 { font-size: 1.2rem; margin-bottom: 4px; }
  .diagram-meta p { color: var(--muted); font-size: 0.85rem; }
  .diagram-render {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    overflow: auto;
    min-height: 400px;
    max-height: 80vh;
  }
  .diagram-render .mermaid {
    display: block;
  }
  .diagram-render svg {
    height: auto;
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .controls button {
    padding: 4px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .controls button:hover { color: var(--text); border-color: var(--accent); }
  .references {
    margin-top: 32px;
    padding: 20px;
    background: var(--surface);
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .references b { color: var(--text); }
  footer {
    padding: 24px 40px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    margin-top: 40px;
  }
  @media (max-width: 768px) {
    header, nav, main, footer { padding-left: 16px; padding-right: 16px; }
    nav { gap: 4px; }
    nav button { padding: 6px 12px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

const tabs = document.getElementById('tabs');
const main = document.getElementById('main');

// Build tabs and containers
diagrams.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.textContent = d.title;
  btn.dataset.index = i;
  if (i === 0) btn.classList.add('active');
  btn.onclick = () => switchTab(i);
  tabs.appendChild(btn);

  const container = document.createElement('div');
  container.className = 'diagram-container' + (i === 0 ? ' active' : '');
  container.id = 'diagram-' + d.id;
  container.innerHTML = `
    <div class="diagram-meta">
      <h2>${d.title}</h2>
      <p>${d.subtitle}</p>
    </div>
    <div class="controls">
      <button onclick="zoomIn('${d.id}')">Zoom +</button>
      <button onclick="zoomOut('${d.id}')">Zoom -</button>
      <button onclick="resetZoom('${d.id}')">Reset</button>
    </div>
    <div class="diagram-render" id="render-${d.id}">
      <div id="mermaid-${d.id}">Rendering...</div>
    </div>
  `;
  main.appendChild(container);
});

// Add references
const refsDiv = document.createElement('div');
refsDiv.className = 'references';
refsDiv.innerHTML = `
    <b>References:</b>
    Maruyama et al., "A Concurrent Modular Agent: Framework for Autonomous LLM Agents" (2025) &middot;
    Pi Agent SDK / OpenClaw — mariozechner &middot;
    Plantoid / Symbient — Alternative Machine / Blinded (2025) &middot;
    Minsky, <i>Society of Mind</i> (1986) &middot;
    Anno, <i>Neon Genesis Evangelion</i> (1995) — MAGI system &middot;
    Hogeweg, structure-oriented modeling (1987) &middot;
    Ackley, indefinitely scalable computing (2013) &middot;
    Agent Skills Standard — agentskills.io
`;
main.appendChild(refsDiv);

function switchTab(index) {
  tabs.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === index));
  document.querySelectorAll('.diagram-container').forEach((c, i) => c.classList.toggle('active', i === index));
}

// Zoom controls
const zoomLevels = {};
window.zoomIn = (id) => {
  zoomLevels[id] = (zoomLevels[id] || 1) + 0.2;
  const el = document.getElementById('mermaid-' + id);
  const svg = el.querySelector('svg');
  if (svg) { svg.style.width = `${zoomLevels[id] * 100}%`; svg.style.maxWidth = 'none'; }
};
window.zoomOut = (id) => {
  zoomLevels[id] = Math.max(0.3, (zoomLevels[id] || 1) - 0.2);
  const el = document.getElementById('mermaid-' + id);
  const svg = el.querySelector('svg');
  if (svg) { svg.style.width = `${zoomLevels[id] * 100}%`; svg.style.maxWidth = 'none'; }
};
window.resetZoom = (id) => {
  zoomLevels[id] = 1;
  const el = document.getElementById('mermaid-' + id);
  const svg = el.querySelector('svg');
  if (svg) { svg.style.width = '100%'; svg.style.maxWidth = ''; }
};

// Render ALL diagrams upfront using mermaid.render() — works even when hidden
for (const d of diagrams) {
  try {
    const { svg } = await mermaid.render('svg-' + d.id, d.code);
    document.getElementById('mermaid-' + d.id).innerHTML = svg;
  } catch (e) {
    document.getElementById('mermaid-' + d.id).innerHTML =
      '<p style="color:#ef4444">Render error: ' + e.message + '</p>';
    console.error('Mermaid render error for ' + d.id, e);
  }
}
</script>
</body>
