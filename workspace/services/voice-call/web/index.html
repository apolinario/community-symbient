<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call feyblet</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #18181b;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #f59e0b;
    --warn: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main {
    max-width: 540px; margin: 0 auto; padding: 24px 18px 80px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  .panel {
    background: var(--panel); border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #27272a;
    background: #0a0a0c; color: var(--text); font: inherit;
  }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: 0; font: inherit; font-weight: 600;
    cursor: pointer; transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-call    { background: var(--ok);     color: #052e16; }
  .btn-hangup  { background: var(--warn);   color: #fee; }
  .status {
    padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; color: var(--muted);
    background: #0a0a0c; border: 1px solid #27272a; margin-bottom: 12px;
  }
  .status.live   { color: var(--ok);     border-color: rgba(34, 197, 94, 0.4); }
  .status.error  { color: var(--warn);   border-color: rgba(239, 68, 68, 0.4); }
  .transcript {
    max-height: 50vh; overflow-y: auto; padding: 12px; background: #0a0a0c;
    border-radius: 10px; border: 1px solid #27272a; font-size: 0.92rem;
  }
  .turn { padding: 6px 0; }
  .turn .who { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .turn.you .who { color: var(--accent); }
  .turn.bot .who { color: var(--ok); }
  .indicator {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #444; margin-right: 8px; vertical-align: middle;
  }
  .indicator.speaking { background: var(--accent); }
  .indicator.live { background: var(--ok); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>📻 Call feyblet</h1>
  <div class="sub">Live voice conversation. The whole call airs on the château's FM radio — speak as if everyone tuned in is in the room.</div>

  <div class="panel" id="setup">
    <label for="key">Access key</label>
    <input type="text" id="key" placeholder="ask the operator on-air" autocomplete="off">
    <div style="height:12px"></div>
    <button class="btn-call" id="callBtn">Start call</button>
  </div>

  <div class="panel" id="active" style="display:none">
    <div class="status" id="status"><span class="indicator" id="indicator"></span><span id="statusText">connecting…</span></div>
    <div class="transcript" id="transcript"></div>
    <div style="height:12px"></div>
    <button class="btn-hangup" id="hangupBtn">Hang up</button>
    <div class="hint">First 15 seconds of your speech are saved as your voice — feyblet will reply in your cloned voice. After that it's a real conversation.</div>
  </div>
</main>

<script>
const SAMPLE_RATE = 16000;
const TTS_SAMPLE_RATE = 24000;

const setupEl = document.getElementById('setup');
const activeEl = document.getElementById('active');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const indicator = document.getElementById('indicator');
const transcript = document.getElementById('transcript');
const callBtn = document.getElementById('callBtn');
const hangupBtn = document.getElementById('hangupBtn');
const keyInput = document.getElementById('key');

// Persist key locally so callers don't retype it
keyInput.value = localStorage.getItem('feyblet-call-key') || new URLSearchParams(location.search).get('key') || '';

let ws = null;
let audioCtx = null;
let micStream = null;
let processor = null;
let playQueue = [];
let playing = false;

function setStatus(text, cls = '') {
  statusText.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}
function setIndicator(cls) { indicator.className = 'indicator ' + (cls || ''); }
function addTurn(who, text) {
  const div = document.createElement('div');
  div.className = 'turn ' + who;
  div.innerHTML = `<div class="who">${who === 'you' ? 'you' : 'feyblet'}</div><div>${text}</div>`;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

callBtn.addEventListener('click', async () => {
  const key = keyInput.value.trim();
  if (!key) { keyInput.focus(); return; }
  localStorage.setItem('feyblet-call-key', key);

  setupEl.style.display = 'none';
  activeEl.style.display = 'block';
  setStatus('requesting microphone…');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (err) {
    setStatus('mic permission denied: ' + err.message, 'error');
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  const source = audioCtx.createMediaStreamSource(micStream);
  // ScriptProcessor is deprecated but works everywhere; AudioWorklet is overkill here
  processor = audioCtx.createScriptProcessor(2048, 1, 1);
  source.connect(processor);
  processor.connect(audioCtx.destination);

  const wsScheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsScheme}//${location.host}/v1/call?key=${encodeURIComponent(key)}`;
  setStatus('connecting…');
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => { setStatus('connected — talk to start', 'live'); setIndicator('live'); };
  ws.onclose = (ev) => {
    setStatus(`call ended (${ev.code})`, ev.code === 4401 ? 'error' : '');
    cleanup();
  };
  ws.onerror = () => { setStatus('connection error', 'error'); };

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      const msg = JSON.parse(ev.data);
      if (msg.event === 'ready') addTurn('bot', msg.message);
      else if (msg.event === 'speech_start') setIndicator('speaking');
      else if (msg.event === 'voice_ref_saved') addTurn('bot', `(voice cloned — "${msg.ref_text.slice(0,80)}…")`);
      else if (msg.event === 'collecting_voice') setStatus(`getting your voice: ${msg.seconds_collected}/${msg.seconds_needed}s`, 'live');
      else if (msg.event === 'transcription') addTurn('you', msg.text);
      else if (msg.event === 'llm_response') addTurn('bot', msg.text);
      else if (msg.event === 'busy') addTurn('bot', msg.message);
      else if (msg.event === 'error') addTurn('bot', '(error: ' + msg.message + ')');
    } else {
      // Binary PCM at 24kHz from TTS
      enqueuePcm(new Int16Array(ev.data));
    }
  };

  processor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const v = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    ws.send(i16.buffer);
  };
});

hangupBtn.addEventListener('click', () => {
  if (ws) ws.close();
  cleanup();
});

function cleanup() {
  if (processor) { processor.disconnect(); processor = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  ws = null;
  setIndicator('');
}

// PCM playback queue — TTS chunks arrive at 24kHz, we play them in order
async function enqueuePcm(int16Pcm) {
  playQueue.push(int16Pcm);
  if (!playing) {
    playing = true;
    await drainQueue();
    playing = false;
  }
}
async function drainQueue() {
  // Use a separate AudioContext at TTS rate to avoid resampling artifacts
  if (!window.ttsCtx) window.ttsCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TTS_SAMPLE_RATE });
  let nextStart = window.ttsCtx.currentTime;
  while (playQueue.length) {
    const i16 = playQueue.shift();
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = window.ttsCtx.createBuffer(1, f32.length, TTS_SAMPLE_RATE);
    buf.getChannelData(0).set(f32);
    const src = window.ttsCtx.createBufferSource();
    src.buffer = buf;
    src.connect(window.ttsCtx.destination);
    src.start(nextStart);
    nextStart += buf.duration;
  }
}
</script>
</body>
</html>
