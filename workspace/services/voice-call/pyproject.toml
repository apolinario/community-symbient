[project]
name = "feyblet-voice-call"
version = "0.1.0"
description = "Live voice-call server for feyblet"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.24",
    "soundfile>=0.12",
    "onnxruntime>=1.17",
    "httpx>=0.26",
    "requests>=2.31",
    "websockets>=12",
]
